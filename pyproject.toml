[project]
name = "karaoke"
version = "0.1.0"
description = "Karaokê local: fila por QR code, vídeos do YouTube, remoção de voz e autotune"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "yt-dlp[default]>=2026.8",
  "segno>=1.6",
  "httpx>=0.27",
  "audio-separator[cpu]>=0.30",
  "audioread>=3.1.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
